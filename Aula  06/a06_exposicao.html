<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exposição Dialogada — Layout com Flexbox · Aula 06</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;color:#1e293b;background:#f8fafc;overflow:hidden}

#app{display:flex;flex-direction:column;height:100vh;padding-bottom:52px}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0;flex-wrap:wrap;gap:8px}
.hdr-left{display:flex;align-items:center;gap:12px}
.badge{background:#1d4ed8;color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.hdr-title{font-size:14px;font-weight:600;color:#1e293b}
.hdr-sub{font-size:12px;color:#94a3b8;margin-top:1px}
.timer{font-size:13px;font-weight:500;color:#64748b;background:#f1f5f9;padding:5px 14px;border-radius:8px;border:1px solid #e2e8f0;min-width:64px;text-align:center;font-family:'Courier New',monospace}
.timer.warn{color:#d97706;background:#fffbeb;border-color:#fcd34d}
.timer.danger{color:#dc2626;background:#fef2f2;border-color:#fca5a5}

/* PROGRESS DOTS */
.dots{display:flex;align-items:center;gap:6px;padding:10px 20px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0;overflow-x:auto;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;cursor:pointer;transition:all .2s;flex-shrink:0}
.dot.active{background:#1d4ed8;transform:scale(1.45)}
.dot.done{background:#93c5fd;opacity:.6}
.dot-sep{width:12px;height:1px;background:#e2e8f0;flex-shrink:0}

/* SLIDE AREA */
.slide-wrap{flex:1;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;padding:24px 28px;overflow-y:auto;display:none}
.slide.active{display:block;animation:sIn .25s ease}
@keyframes sIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* TYPOGRAPHY */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#94a3b8;margin-bottom:6px}
.slide-title{font-size:22px;font-weight:600;color:#1e293b;line-height:1.2;margin-bottom:6px}
.slide-sub{font-size:14px;color:#64748b;line-height:1.6;margin-bottom:18px}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px}
.card.accent{border-left:3px solid #1d4ed8}
.card-icon{font-size:20px;margin-bottom:6px}
.card-title{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:4px}
.card-body{font-size:12px;color:#64748b;line-height:1.55}
.card-body em{font-style:italic}
.card-body code{font-family:'Courier New',monospace;font-size:11px;background:#f1f5f9;padding:1px 4px;border-radius:3px;border:1px solid #e2e8f0}

/* FLEX AXIS VISUAL */
.axis-demo{border:1px dashed #93c5fd;border-radius:10px;padding:16px;margin:10px 0 18px;position:relative;background:#eff6ff}
.axis-demo .arrow-main{position:absolute;top:6px;left:16px;font-size:10px;font-weight:700;color:#1d4ed8;text-transform:uppercase;letter-spacing:.05em}
.axis-demo .arrow-cross{position:absolute;top:6px;right:16px;font-size:10px;font-weight:700;color:#be185d;text-transform:uppercase;letter-spacing:.05em}
.axis-row{display:flex;gap:10px;margin-top:14px}
.axis-box{background:#3b82f6;color:#fff;font-weight:700;font-size:13px;padding:14px 0;border-radius:6px;flex:1;text-align:center}

/* FLEX PLAYGROUND (justify/align mini demo) */
.flex-preview{display:flex;border:1px solid #e2e8f0;border-radius:10px;background:#fff;min-height:90px;padding:10px;margin-bottom:10px;transition:all .25s}
.flex-preview .fitem{background:#3b82f6;color:#fff;font-size:12px;font-weight:600;border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:center}

/* TIMELINE */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1.5px;background:#e2e8f0}
.tl-item{position:relative;margin-bottom:14px;cursor:pointer}
.tl-item::before{content:'';position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid #e2e8f0;background:#fff;transition:all .2s}
.tl-item:hover::before{background:#3b82f6;border-color:#3b82f6}
.tl-item.tl-open::before{background:#1d4ed8;border-color:#1d4ed8;transform:scale(1.25)}
.tl-year{font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:2px}
.tl-head{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:3px}
.tl-desc{font-size:12px;color:#64748b;line-height:1.55;max-height:0;overflow:hidden;transition:max-height .3s ease}
.tl-item.tl-open .tl-desc{max-height:160px}
.tl-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-top:5px}

/* CODE */
.code-wrap{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin:10px 0}
.code-hdr{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;padding:7px 14px;border-bottom:1px solid #e2e8f0}
.code-lang{font-size:11px;font-weight:500;color:#64748b}
.cdots{display:flex;gap:5px}
.cdot{width:10px;height:10px;border-radius:50%}
pre{background:#1e293b;color:#e2e8f0;padding:14px 16px;font-size:12px;line-height:1.75;overflow-x:auto;font-family:'Courier New',monospace;white-space:pre}
.k{color:#93c5fd}.kv{color:#6ee7b7}.a{color:#fde68a}.s{color:#fda4af}.t{color:#e2e8f0}.c{color:#475569;font-style:italic}

/* COMPARE */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:560px){.compare{grid-template-columns:1fr}}
.comp-side{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.comp-hdr{padding:8px 14px;font-size:12px;font-weight:600}
.comp-body{padding:10px 14px;font-size:12px;color:#64748b;line-height:1.65}
.comp-body code{font-family:'Courier New',monospace;font-size:11px;background:#f1f5f9;padding:1px 4px;border-radius:3px;border:1px solid #e2e8f0}

/* TAG EXPLORER */
.tag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
@media(max-width:500px){.tag-grid{grid-template-columns:1fr 1fr}}
.tag-item{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .15s}
.tag-item:hover{border-color:#93c5fd;background:#eff6ff}
.tag-item.tag-on{border-color:#1d4ed8;background:#eff6ff}
.tag-code{font-size:12px;font-weight:600;color:#1d4ed8;font-family:'Courier New',monospace;margin-bottom:3px}
.tag-name{font-size:11px;color:#94a3b8}
.tag-preview{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px 14px;min-height:56px;font-size:13px;color:#64748b;line-height:1.6}
.tag-preview strong{color:#1e293b;font-weight:600;font-family:'Courier New',monospace}

/* QUIZ */
.quiz-q{font-size:14px;font-weight:600;color:#1e293b;margin-bottom:12px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:13px;color:#1e293b;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.quiz-opt:hover:not(.correct):not(.wrong):not(.dimmed){border-color:#93c5fd;background:#eff6ff}
.quiz-opt.correct{background:#f0fdf4;border-color:#86efac;color:#15803d;pointer-events:none}
.quiz-opt.wrong{background:#fef2f2;border-color:#fca5a5;color:#dc2626;pointer-events:none}
.quiz-opt.dimmed{opacity:.4;pointer-events:none}
.quiz-feedback{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-block{margin-bottom:18px}

/* REFLECT */
.reflect-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.reflect-item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px}
.reflect-num{width:24px;height:24px;min-width:24px;border-radius:6px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
.reflect-text{font-size:13px;color:#64748b;line-height:1.55}
.reflect-text strong{color:#1e293b;font-weight:600}

/* HIGHLIGHT BOX */
.hl{background:#fffbeb;border-left:3px solid #f59e0b;padding:10px 14px;font-size:13px;color:#78350f;line-height:1.55;margin:10px 0}
.hl strong{color:#92400e;font-weight:600}

/* NAV BAR */
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid #e2e8f0;background:#fff;flex-shrink:0}
.nav-btn{background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;padding:7px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.nav-btn:hover{background:#e2e8f0;color:#1e293b}
.nav-btn.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.nav-btn.primary:hover{background:#1e40af}
.nav-btn:disabled{opacity:.35;pointer-events:none}
.nav-counter{font-size:12px;color:#94a3b8}

code{font-family:'Courier New',monospace;font-size:12px;background:#f1f5f9;padding:1px 5px;border-radius:3px;border:1px solid #e2e8f0}

/* ── Autoria @karizeviecelli ── */
.autoria-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;color:#2563eb;
  background:#eff6ff;border:1px solid #bfdbfe;
  padding:2px 9px;border-radius:20px;text-decoration:none;
  font-family:'Courier New',monospace;letter-spacing:.02em;white-space:nowrap;
}
.autoria-badge:hover{background:#bfdbfe;color:#1e40af}
</style>
</head>
<body>

<div id="app">
  <div class="hdr">
    <div class="hdr-left">
      <span class="badge">Aula 06</span>
      <div>
        <div class="hdr-title">Layout com Flexbox — Exposição Dialogada</div>
        <div class="hdr-sub">30 minutos · Projetor · Turma</div>
      </div>
    </div>
    <a href="https://instagram.com/karizeviecelli" target="_blank" class="autoria-badge">© @karizeviecelli</a>
    <div class="timer" id="timer">30:00</div>
  <button onclick="window.location.href='a06_demo_ao_vivo.html'" style="font-size:12px;font-weight:600;background:#fff;border:1.5px solid #1d4ed8;color:#1d4ed8;padding:5px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;transition:background .15s" onmouseover="this.style.background='#eff6ff'" onmouseout="this.style.background='#fff'">💻 Demo ao Vivo →</button>
  </div>

  <div class="dots" id="dots-bar"></div>

  <div class="slide-wrap" id="slide-wrap"></div>

  <div class="nav">
    <button class="nav-btn" id="btn-prev" onclick="nav(-1)" disabled>← Anterior</button>
    <span class="nav-counter" id="counter">1 / 9</span>
    <button class="nav-btn primary" id="btn-next" onclick="nav(1)">Próximo →</button>
  </div>
</div>

<script>
const SLIDES = [
  {
    id:'intro', time:3,
    render:()=>`
      <div class="eyebrow">Abertura · 3 minutos</div>
      <div class="slide-title">Os móveis da sala se ajustam ao espaço</div>
      <div class="slide-sub">Até aqui, cada caixa era um quadro fixo na parede. O Flexbox é como ter um decorador inteligente organizando os móveis da sala para você.</div>
      <div class="cards">
        <div class="card accent">
          <div class="card-icon">🛋️</div>
          <div class="card-title">display: flex no pai</div>
          <div class="card-body">Você avisa o decorador: "esta sala agora é flexível".</div>
        </div>
        <div class="card accent">
          <div class="card-icon">↔️</div>
          <div class="card-title">justify-content</div>
          <div class="card-body">"Distribua os móveis assim ao longo da fila."</div>
        </div>
        <div class="card">
          <div class="card-icon">↕️</div>
          <div class="card-title">align-items</div>
          <div class="card-body">"Alinhe todos na mesma altura, desse jeito."</div>
        </div>
        <div class="card">
          <div class="card-icon">📐</div>
          <div class="card-title">Cada item tem personalidade</div>
          <div class="card-body">Pode crescer, encolher ou pedir um alinhamento próprio.</div>
        </div>
      </div>
      <div class="hl"><strong>Pergunta para a turma:</strong> Quem já tentou centralizar um elemento na tela com CSS "puro" e sofreu? O Flexbox resolve isso em uma linha.</div>`
  },
  {
    id:'eixos', time:6,
    render:()=>`
      <div class="eyebrow">Conceito-base · 6 minutos</div>
      <div class="slide-title">Eixo principal x eixo cruzado</div>
      <div class="slide-sub"><code>justify-content</code> trabalha no eixo principal (main axis). <code>align-items</code> trabalha no eixo cruzado (cross axis). Essa é a regra mais importante da aula.</div>
      <div class="axis-demo">
        <span class="arrow-main">eixo principal →</span>
        <span class="arrow-cross">eixo cruzado ↓</span>
        <div class="axis-row">
          <div class="axis-box">1</div>
          <div class="axis-box">2</div>
          <div class="axis-box">3</div>
        </div>
      </div>
      <div class="compare">
        <div class="comp-side">
          <div class="comp-hdr" style="background:#eff6ff;color:#1d4ed8">flex-direction: row (padrão)</div>
          <div class="comp-body" style="display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:8px;min-height:90px">
            <div class="fitem" style="background:#3b82f6;color:#fff;padding:8px 12px;border-radius:6px;font-weight:600">A</div>
            <div class="fitem" style="background:#3b82f6;color:#fff;padding:16px 12px;border-radius:6px;font-weight:600">B</div>
            <div class="fitem" style="background:#3b82f6;color:#fff;padding:8px 12px;border-radius:6px;font-weight:600">C</div>
          </div>
        </div>
        <div class="comp-side">
          <div class="comp-hdr" style="background:#fdf4ff;color:#a21caf">flex-direction: column</div>
          <div class="comp-body" style="display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:8px;min-height:90px">
            <div class="fitem" style="background:#a21caf;color:#fff;padding:6px 12px;border-radius:6px;font-weight:600">A</div>
            <div class="fitem" style="background:#a21caf;color:#fff;padding:6px 24px;border-radius:6px;font-weight:600">B</div>
            <div class="fitem" style="background:#a21caf;color:#fff;padding:6px 12px;border-radius:6px;font-weight:600">C</div>
          </div>
        </div>
      </div>
      <div class="hl"><strong>Mesmo CSS nos dois lados</strong> (<code>justify-content: space-between; align-items: center</code>). Em <code>column</code> os eixos INVERTEM: o <code>space-between</code> passa a distribuir na vertical e o <code>align-items: center</code> passa a centralizar na horizontal.</div>`
  },
  {
    id:'justify', time:6,
    render:()=>`
      <div class="eyebrow">Distribuindo espaço · 6 minutos</div>
      <div class="slide-title">justify-content e align-items</div>
      <div class="slide-sub">Comparação lado a lado dos dois eixos.</div>
      <div class="compare">
        <div class="comp-side">
          <div class="comp-hdr" style="background:#eff6ff;color:#1d4ed8">justify-content (eixo principal)</div>
          <div class="comp-body">
            <code>flex-start</code> — encosta no início<br>
            <code>center</code> — centraliza<br>
            <code>space-between</code> — espaço só entre os itens<br>
            <code>space-around</code> — espaço igual, inclusive nas pontas (metade)<br>
            <code>space-evenly</code> — espaço totalmente igual, inclusive nas pontas
          </div>
        </div>
        <div class="comp-side">
          <div class="comp-hdr" style="background:#fdf4ff;color:#a21caf">align-items (eixo cruzado)</div>
          <div class="comp-body">
            <code>flex-start</code> — alinha no topo<br>
            <code>center</code> — centraliza verticalmente<br>
            <code>flex-end</code> — alinha na base<br>
            <code>stretch</code> — estica para ocupar a altura toda (padrão)<br>
            <code>baseline</code> — alinha pela linha de base do texto
          </div>
        </div>
      </div>`
  },
  {
    id:'wrapgap', time:5,
    render:()=>`
      <div class="eyebrow">Quando não cabe tudo · 5 minutos</div>
      <div class="slide-title">flex-wrap e gap</div>
      <div class="slide-sub">Se os móveis não cabem na fila, eles continuam em uma segunda fileira — e o gap organiza o espaço entre eles.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">CSS · .grade-de-cards</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="k">.grade-de-cards</span> <span class="t">{</span>
  <span class="a">display</span>: <span class="s">flex</span><span class="t">;</span>
  <span class="a">flex-wrap</span>: <span class="s">wrap</span><span class="t">;</span> <span class="c">/* quebra linha se não couber */</span>
  <span class="a">gap</span>: <span class="s">16px</span><span class="t">;</span> <span class="c">/* espaço entre os itens */</span>
<span class="t">}</span></pre>
      </div>
      <div class="hl"><strong>Sem <code>flex-wrap: wrap</code></strong> (padrão <code>nowrap</code>), os itens tentam encolher para caber tudo na mesma linha — podendo espremer o conteúdo.</div>`
  },
  {
    id:'itens', time:5,
    render:()=>`
      <div class="eyebrow">Personalidade de cada item · 5 minutos</div>
      <div class="slide-title">flex-grow, flex-shrink, align-self, order</div>
      <div class="slide-sub">Cada móvel pode se comportar de um jeito diferente dos demais.</div>
      <div class="code-wrap">
        <div class="code-hdr">
          <span class="code-lang">CSS · .item</span>
          <div class="cdots"><div class="cdot" style="background:#ef4444"></div><div class="cdot" style="background:#f59e0b"></div><div class="cdot" style="background:#10b981"></div></div>
        </div>
        <pre><span class="k">.item</span> <span class="t">{</span>
  <span class="a">flex-grow</span>: <span class="s">1</span><span class="t">;</span>   <span class="c">/* cresce para ocupar espaço sobrando */</span>
  <span class="a">flex-shrink</span>: <span class="s">1</span><span class="t">;</span> <span class="c">/* encolhe se faltar espaço */</span>
  <span class="a">flex-basis</span>: <span class="s">200px</span><span class="t">;</span> <span class="c">/* tamanho de partida */</span>
  <span class="a">flex</span>: <span class="s">1 1 200px</span><span class="t">;</span> <span class="c">/* atalho: grow shrink basis */</span>
<span class="t">}</span>

<span class="k">.item-especial</span> <span class="t">{</span>
  <span class="a">align-self</span>: <span class="s">flex-end</span><span class="t">;</span> <span class="c">/* sobrescreve align-items só pra este item */</span>
  <span class="a">order</span>: <span class="s">-1</span><span class="t">;</span>          <span class="c">/* aparece primeiro, mesmo estando no meio do HTML */</span>
<span class="t">}</span></pre>
      </div>`
  },
  {
    id:'explorer', time:5,
    render:()=>`
      <div class="eyebrow">Prática interativa · 5 minutos</div>
      <div class="slide-title">justify-content — clique para explorar</div>
      <div class="slide-sub">Veja o efeito de cada valor na distribuição dos itens.</div>
      <div class="tag-grid">
        <div class="tag-item" onclick="showTag(this,'flex-start','Itens encostados no início do container (padrão). Sobra espaço só no final da fila.')">
          <div class="tag-code">flex-start</div><div class="tag-name">Início da fila</div>
        </div>
        <div class="tag-item" onclick="showTag(this,'center','Todos os itens centralizados no meio do container, com espaço igual nas duas pontas.')">
          <div class="tag-code">center</div><div class="tag-name">Centralizado</div>
        </div>
        <div class="tag-item" onclick="showTag(this,'space-between','Primeiro item na ponta inicial, último na ponta final, e o espaço sobrando é dividido igualmente SÓ entre os itens do meio.')">
          <div class="tag-code">space-between</div><div class="tag-name">Espaço só entre os itens</div>
        </div>
        <div class="tag-item" onclick="showTag(this,'space-around','Cada item recebe a mesma margem dos dois lados — por isso o espaço nas pontas é a metade do espaço entre os itens do meio.')">
          <div class="tag-code">space-around</div><div class="tag-name">Espaço ao redor de cada item</div>
        </div>
        <div class="tag-item" onclick="showTag(this,'space-evenly','O espaço é dividido de forma totalmente igual entre TODOS os intervalos, inclusive as pontas — sem a diferença do space-around.')">
          <div class="tag-code">space-evenly</div><div class="tag-name">Tudo igual, sem exceção</div>
        </div>
        <div class="tag-item" onclick="showTag(this,'flex-end','Itens encostados no final do container. Sobra espaço só no início da fila.')">
          <div class="tag-code">flex-end</div><div class="tag-name">Final da fila</div>
        </div>
      </div>
      <div class="flex-preview" id="flex-live" style="justify-content:flex-start;gap:0">
        <div class="fitem">1</div><div class="fitem">2</div><div class="fitem">3</div>
      </div>
      <div class="tag-preview" id="tag-prev">Clique em um valor acima: a caixa de cima mostra o efeito real e a descrição aparece aqui.</div>`
  },
  {
    id:'quiz', time:3,
    render:()=>`
      <div class="eyebrow">Verificação de aprendizagem · 3 minutos</div>
      <div class="slide-title">Quiz rápido — turma responde junto</div>
      <div class="slide-sub">Sem pressão. O objetivo é consolidar o que aprendemos.</div>
      <div class="quiz-block">
        <div class="quiz-q">1. Em um container com <code>display: flex</code> e <code>flex-direction: row</code>, qual propriedade centraliza os itens verticalmente?</div>
        <div class="quiz-opts">
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>A</span>justify-content: center</div>
          <div class="quiz-opt" onclick="answer(this,'c','fb1')"><span>B</span>align-items: center</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>C</span>text-align: center</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb1')"><span>D</span>flex-wrap: center</div>
        </div>
        <div class="quiz-feedback" id="fb1" style="background:#f0fdf4;color:#15803d">Correto! Com row, o eixo cruzado é vertical, e quem controla o eixo cruzado é o align-items.</div>
      </div>
      <div class="quiz-block">
        <div class="quiz-q">2. Um item tem <code>flex-grow: 1</code> e outro <code>flex-grow: 3</code>. Como o espaço sobrando é dividido?</div>
        <div class="quiz-opts">
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>A</span>Igualmente entre os dois</div>
          <div class="quiz-opt" onclick="answer(this,'c','fb2')"><span>B</span>1/4 para o primeiro, 3/4 para o segundo</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>C</span>Só o segundo recebe espaço</div>
          <div class="quiz-opt" onclick="answer(this,'w','fb2')"><span>D</span>Depende do flex-basis, não do flex-grow</div>
        </div>
        <div class="quiz-feedback" id="fb2" style="background:#f0fdf4;color:#15803d">Correto! O total de "partes" é 1+3=4. O primeiro item recebe 1/4 do espaço extra, o segundo recebe 3/4.</div>
      </div>`
  },
  {
    id:'curiosidades', time:1,
    render:()=>`
      <div class="eyebrow">Bônus · 1 minuto</div>
      <div class="slide-title">Você sabia?</div>
      <div class="slide-sub">Fatos sobre Flexbox que valem compartilhar com a turma.</div>
      <div class="cards">
        <div class="card accent">
          <div class="card-icon">🎯</div>
          <div class="card-title">Centralizar ficou trivial</div>
          <div class="card-body">Antes do Flexbox, centralizar um elemento vertical e horizontalmente exigia truques. Hoje: <code>display:flex; justify-content:center; align-items:center;</code></div>
        </div>
        <div class="card accent">
          <div class="card-icon">👶</div>
          <div class="card-title">Só afeta os filhos DIRETOS</div>
          <div class="card-body">display:flex organiza apenas os filhos imediatos do container — netos não são afetados automaticamente.</div>
        </div>
        <div class="card">
          <div class="card-icon">🔄</div>
          <div class="card-title">order não muda o HTML</div>
          <div class="card-body">order reordena só visualmente. Leitores de tela e a navegação por Tab ainda seguem a ordem original do HTML.</div>
        </div>
        <div class="card">
          <div class="card-icon">🧭</div>
          <div class="card-title">Flexbox é 1D, Grid é 2D</div>
          <div class="card-body">Flexbox organiza bem uma fila (linha OU coluna). Para controlar linhas E colunas ao mesmo tempo, a ferramenta certa é o CSS Grid — aula 7.</div>
        </div>
      </div>`
  },
  {
    id:'fechamento', time:1,
    render:()=>`
      <div class="eyebrow">Encerramento · 1 minuto</div>
      <div class="slide-title">Recapitulando e partindo para a prática</div>

      <div class="reflect-list">
        <div class="reflect-item">
          <div class="reflect-num">1</div>
          <div class="reflect-text"><strong>display: flex</strong> transforma os filhos diretos em itens flexíveis, organizados ao longo de um eixo.</div>
        </div>
        <div class="reflect-item">
          <div class="reflect-num">2</div>
          <div class="reflect-text"><strong>justify-content</strong> controla o eixo principal, <strong>align-items</strong> controla o eixo cruzado.</div>
        </div>
        <div class="reflect-item">
          <div class="reflect-num">3</div>
          <div class="reflect-text"><strong>flex-wrap e gap</strong> resolvem quebra de linha e espaçamento sem margin manual.</div>
        </div>
        <div class="reflect-item">
          <div class="reflect-num">4</div>
          <div class="reflect-text"><strong>Agora é hora de construir.</strong> Na demo e na prática guiada: navbar + grade de cards (eixo <code>row</code>). No desafio: página "Nossa Equipe" com <code>column</code>, proporções e <code>align-self</code>.</div>
        </div>
      </div>
      <div class="hl"><strong>Checkpoint 2 do projeto final:</strong> o desafio de hoje (página "Nossa Equipe") conta como avaliação do projeto.</div>`
  }
];

let cur = 0;
let timerInterval = null;
let timerStarted = false;

function buildDots() {
  const bar = document.getElementById('dots-bar');
  SLIDES.forEach((s, i) => {
    const d = document.createElement('span');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.title = 'Slide ' + (i + 1);
    d.onclick = () => goTo(i);
    bar.appendChild(d);
    if (i < SLIDES.length - 1) {
      const sep = document.createElement('div');
      sep.className = 'dot-sep';
      bar.appendChild(sep);
    }
  });
}

function buildSlides() {
  const wrap = document.getElementById('slide-wrap');
  SLIDES.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === 0 ? ' active' : '');
    div.id = 'sl-' + s.id;
    div.innerHTML = s.render();
    wrap.appendChild(div);
  });
}

function goTo(i) {
  const prev = cur;
  document.getElementById('sl-' + SLIDES[prev].id).classList.remove('active');
  const dots = document.querySelectorAll('.dot');
  dots[prev].classList.remove('active');
  if (i > prev) dots[prev].classList.add('done');

  cur = i;
  const el = document.getElementById('sl-' + SLIDES[cur].id);
  el.innerHTML = SLIDES[cur].render();
  el.classList.add('active');
  dots[cur].classList.add('active');
  dots[cur].classList.remove('done');

  document.getElementById('btn-prev').disabled = cur === 0;
  const btnNext = document.getElementById('btn-next');
  btnNext.disabled = cur === SLIDES.length - 1;
  btnNext.textContent = cur === SLIDES.length - 1 ? 'Finalizar' : 'Próximo →';
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + SLIDES.length;

  if (!timerStarted) { timerStarted = true; startTimer(); }
}

function nav(d) {
  const ni = cur + d;
  if (ni >= 0 && ni < SLIDES.length) goTo(ni);
}

function startTimer() {
  let rem = 30 * 60;
  const el = document.getElementById('timer');
  timerInterval = setInterval(() => {
    rem--;
    if (rem <= 0) { clearInterval(timerInterval); el.textContent = '00:00'; el.className = 'timer danger'; return; }
    const m = Math.floor(rem / 60), s = rem % 60;
    el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    if (rem <= 300) el.className = 'timer warn';
    if (rem <= 60)  el.className = 'timer danger';
  }, 1000);
}

function tlClick(i) {
  document.querySelectorAll('.tl-item').forEach((el, j) => el.classList.toggle('tl-open', j === i));
}

function showTag(el, tag, desc) {
  document.querySelectorAll('.tag-item').forEach(t => t.classList.remove('tag-on'));
  el.classList.add('tag-on');
  const live = document.getElementById('flex-live');
  if (live) live.style.justifyContent = tag;
  document.getElementById('tag-prev').innerHTML =
    '<strong>justify-content: ' + tag + '</strong><br>' + desc;
}

function answer(el, type, fbId) {
  const block = el.closest('.quiz-block');
  block.querySelectorAll('.quiz-opt').forEach(o => {
    if (o === el) o.classList.add(type === 'c' ? 'correct' : 'wrong');
    else o.classList.add('dimmed');
  });
  const fb = document.getElementById(fbId);
  if (type !== 'c') {
    fb.style.background = '#fef2f2';
    fb.style.color = '#dc2626';
    fb.textContent = 'Não exatamente — pense em qual eixo (principal ou cruzado) cada propriedade controla.';
  }
  fb.style.display = 'block';
}

buildDots();
buildSlides();
document.getElementById('btn-prev').disabled = true;
</script>
